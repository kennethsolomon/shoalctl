# GoReleaser v2. Builds shoalctl for darwin, linux and windows on amd64 and
# arm64 without cgo (modernc.org/sqlite is pure Go), archives the binary
# with LICENSE and README.md only (spec §13), writes checksums.txt, and
# publishes the Homebrew formula kennethsolomon/tap/shoalctl.
#
# Local check: goreleaser check && goreleaser release --snapshot --clean
# (a snapshot never publishes). The release workflow
# (.github/workflows/release.yml) runs on a v* tag push only.
version: 2

project_name: shoalctl

before:
  hooks:
    - go mod verify

builds:
  - id: shoalctl
    main: ./cmd/shoalctl
    binary: shoalctl
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    # Reproducible: the same commit builds the same bytes on any checkout.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: shoalctl
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The binary plus these files, nothing else: the release guard
    # (internal/releaseguard) fails the release on any other file, any .db
    # file or any reports/ path.
    # mtime, mode and owner are pinned: a checkout stamps LICENSE and
    # README.md with the time it ran, its umask and its user, which would
    # otherwise make two builds of one commit differ.
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  github:
    owner: kennethsolomon
    name: shoalctl
  prerelease: auto
  # Created as a draft, which only repo writers see. release.yml runs the
  # release guard on dist/, checks the uploaded assets against
  # dist/checksums.txt, and only then publishes the draft. One build: the
  # guarded bytes are the published bytes.
  draft: true

# brews writes a formula, as spec §2 names it (kennethsolomon/tap/shoalctl).
# GoReleaser 2.10+ marks brews deprecated in favour of homebrew_casks, so
# `goreleaser check` exits 2 with "valid, but uses deprecated properties";
# the release itself only warns. See tasks/progress.md, Phase 5 risks.
brews:
  - name: shoalctl
    repository:
      owner: kennethsolomon
      name: homebrew-tap
    # GoReleaser never pushes the formula: it only writes it to
    # dist/homebrew/Formula/shoalctl.rb. release.yml pushes that file to the
    # tap after the guarded draft is published, and only for a stable tag
    # with HOMEBREW_TAP_GITHUB_TOKEN set (a draft's URLs do not download).
    skip_upload: "true"
    directory: Formula
    commit_msg_template: "chore(formula): shoalctl {{ .Tag }}"
    homepage: https://github.com/kennethsolomon/shoalctl
    description: Run many Claude Code sessions on one repo without collisions, and remember why the code is the way it is
    license: MIT
    dependencies:
      - name: git
      - name: tmux
    install: |
      bin.install "shoalctl"
    test: |
      assert_match version.to_s, shell_output("#{bin}/shoalctl version")
