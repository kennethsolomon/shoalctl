name: release

# Runs only when a v* tag is pushed. Nothing here runs on branches or PRs;
# ci.yml covers those.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Every release target runs the FTS5 spike without cgo (spec §2,
          # FTS5 note). The full suite runs on the primary platforms; Windows
          # is beta (spec §15.1), so its full suite does not block a release.
          - { target: linux/amd64, os: ubuntu-latest, suite: full }
          - { target: linux/arm64, os: ubuntu-24.04-arm, suite: fts5 }
          - { target: darwin/arm64, os: macos-latest, suite: full }
          - { target: darwin/amd64, os: macos-15-intel, suite: fts5 }
          - { target: windows/amd64, os: windows-latest, suite: full }
          - { target: windows/arm64, os: windows-11-arm, suite: fts5 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: FTS5 without cgo
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go env GOOS GOARCH
          go test -count=1 -run TestFTS5CreateInsertMatch -v ./internal/spike

      - name: Store and release guard without cgo
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./internal/store ./internal/releaseguard ./internal/buildinfo

      - name: Install tmux (Linux)
        if: matrix.suite == 'full' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: matrix.suite == 'full' && runner.os == 'macOS'
        run: brew install tmux

      - name: Full suite
        if: matrix.suite == 'full'
        shell: bash
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: go test -count=1 -timeout 20m ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.0
          install-only: true

      # One build. It uploads to a draft release (.goreleaser.yaml
      # release.draft), which only repo writers can see; nothing is public
      # until the guard and the asset check below pass. GoReleaser never
      # pushes the formula (brews skip_upload); the last step does.
      - name: Build and upload to a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Release guard (no .db file, no reports/ path, binary + LICENSE + README only)
        run: SHOAL_DIST="$GITHUB_WORKSPACE/dist" go test -count=1 -run TestReleaseArtifacts -v ./internal/releaseguard

      # The draft's assets must be exactly the guarded files: same
      # checksums.txt, and every archive hashing to its line in it.
      - name: Draft assets are the guarded ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          got="$RUNNER_TEMP/draft-assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$got"
          if ! cmp -s dist/checksums.txt "$got/checksums.txt"; then
            echo "::error::the draft's checksums.txt differs from the guarded dist/checksums.txt; the draft stays unpublished"
            diff dist/checksums.txt "$got/checksums.txt" || true
            exit 1
          fi
          if ! (cd "$got" && sha256sum --check --strict checksums.txt); then
            echo "::error::a draft asset does not match the guarded checksums; the draft stays unpublished"
            exit 1
          fi
          want=$(awk '{print $2}' dist/checksums.txt | sort)
          have=$(cd "$got" && for f in *; do [ "$f" = checksums.txt ] || echo "$f"; done | sort)
          if [ "$want" != "$have" ]; then
            echo "::error::the draft holds other assets than the guarded ones: want [$want], have [$have]"
            exit 1
          fi

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # A prerelease tag (v1.2.0-rc.1: any "-" suffix, as GoReleaser's
      # prerelease: auto reads it) or a missing token pushes no formula.
      - name: Push the Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) echo "::notice::$TAG is a prerelease; the Homebrew formula is not pushed"; exit 0 ;;
          esac
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is not set; the Homebrew formula is not pushed"
            exit 0
          fi
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/kennethsolomon/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Formula"
          cp dist/homebrew/Formula/shoalctl.rb "$tap/Formula/shoalctl.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shoalctl.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "chore(formula): shoalctl $TAG"
          git push origin HEAD:main
