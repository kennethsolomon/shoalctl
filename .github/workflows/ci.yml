name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        experimental: [false]
        include:
          # Windows is beta: it still runs, but a failure does not mark main red.
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: FTS5 without cgo
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -run TestFTS5CreateInsertMatch -v ./internal/spike

      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      # -race needs cgo and a C toolchain, which the Windows runner does not
      # guarantee; the race detector already runs on Linux and macOS.
      - name: go test (Windows, no race detector)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
